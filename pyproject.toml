[project]
name = "onshape-featurescript-ai"
version = "0.1.0"
description = "Onshape REST API client + LLM assistant for generating, explaining, and debugging FeatureScript"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
featurescript-ai = "onshape_featurescript_ai.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onshape_featurescript_ai*"]
